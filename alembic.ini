# alembic.ini
# Alembic configuration file.
# Alembic reads this to find the migrations directory and logging settings.

[alembic]
# Path to migration scripts, relative to where alembic is invoked.
script_location = alembic

# SQLAlchemy URL — overridden at runtime in env.py from database.py.
sqlalchemy.url = sqlite:///./knowledge_graph.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
